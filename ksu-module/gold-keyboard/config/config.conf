version=1

# 默认方案：无规则 => 全透传。Android 保持原生行为（亮度/音量/媒体键/截图）。
# 进入 Anland 沉浸模式时，Anland 写 anland-profile 请求文件，fn-remap 轮询后
# 切到 Anland 方案；退出时删除请求文件，回到本方案。
#
# 物理键盘两个节点（bus 0006 = IIC）：
#   event9  15d9:00a3 "Xiaomi Keyboard"：字母、F1-F24、SYSRQ
#   event12 15d9:00a4 "Xiaomi Consumer"：亮度、音量、媒体键
# 两个都要读，Anland 方案才能同时覆盖键盘区与顶排。
device=/dev/input/event9|0006|15d9|00a3
device=/dev/input/event12|0006|15d9|00a4

profile=Anland
# 顶排（不按 Fn）上报媒体/系统键 → F1-F12 送给容器桌面。
mapping=KEY_BRIGHTNESSDOWN=>KEY_F1
mapping=KEY_BRIGHTNESSUP=>KEY_F2
mapping=KEY_F20=>KEY_F3
mapping=KEY_SYSRQ=>KEY_F4
mapping=KEY_F24=>KEY_F5
mapping=KEY_F23=>KEY_F6
mapping=KEY_PREVIOUSSONG=>KEY_F7
mapping=KEY_PLAYPAUSE=>KEY_F8
mapping=KEY_NEXTSONG=>KEY_F9
mapping=KEY_MUTE=>KEY_F10
mapping=KEY_VOLUMEDOWN=>KEY_F11
mapping=KEY_VOLUMEUP=>KEY_F12

# Fn 层（物理 F1-F12）→ 原生 evdev 码，经 15d9:00a3 虚拟设备发出，
# MIUI 按原生逻辑处理（实测注入验证过的码）：
#   224/225 亮度减/加、190 麦克风、99 截图、194 小爱、193 勿扰、
#   165/164/163 媒体上一首/播放暂停/下一首、113 静音、114/115 音量减/加。
mapping=KEY_F1=>KEY_BRIGHTNESSDOWN
mapping=KEY_F2=>KEY_BRIGHTNESSUP
mapping=KEY_F3=>KEY_F20
mapping=KEY_F4=>KEY_SYSRQ
mapping=KEY_F5=>KEY_F24
mapping=KEY_F6=>KEY_F23
mapping=KEY_F7=>KEY_PREVIOUSSONG
mapping=KEY_F8=>KEY_PLAYPAUSE
mapping=KEY_F9=>KEY_NEXTSONG
mapping=KEY_F10=>KEY_MUTE
mapping=KEY_F11=>KEY_VOLUMEDOWN
mapping=KEY_F12=>KEY_VOLUMEUP
