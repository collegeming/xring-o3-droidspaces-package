# 从上游 Gold Keyboard Remaps 构建本设备定制的 KSU 模块。
#
# 上游用 0xffff:0xffff 作虚拟键盘 VID:PID（刻意避开真实硬件），但 MIUI 只为
# 原生键盘 15d9:00a3 启用截图/音量/亮度/勿扰等系统快捷键。这里按固定 tag 拉上游、
# 应用 ksu-module/gold-keyboard/patches/ 下的身份补丁，再用 NDK 交叉编译并打包。
#
# 产物：Gold_Keyboardremaps-<ver>-yingtian.zip + .sha256
# 发布：publish=true 时创建/更新同名 Release 并附加产物。
name: build gold keyboard ksu

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'publish the module zip as a release'
        type: boolean
        default: false
      prerelease:
        description: 'mark that release as prerelease'
        type: boolean
        default: true

permissions:
  contents: write

env:
  GOLD_REPO: https://github.com/Goldzxcbug/Gold_Keyboardremaps.git
  GOLD_SHA: 73b40145f531e1cfa6202bf84c721314c7baa1ab
  GOLD_TAG: v1.1.1
  ANDROID_API: "26"
  ANDROID_PLATFORM: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  NDK_VERSION: 27.2.12479018

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} ndk;${{ env.NDK_VERSION }}

      - name: Check out upstream Gold Keyboard Remaps
        uses: actions/checkout@v4
        with:
          repository: Goldzxcbug/Gold_Keyboardremaps
          ref: ${{ env.GOLD_SHA }}
          path: .upstream-gold

      - name: Verify upstream pin
        run: |
          set -euo pipefail
          actual=$(git -C .upstream-gold rev-parse HEAD)
          test "$actual" = "$GOLD_SHA"
          echo "upstream $GOLD_TAG @ $actual"

      - name: Verify patch pre-state
        run: |
          set -euo pipefail
          # 身份常量仍是上游旧值：0001 的全部意义就是把它改掉。
          grep -q '^#define VIRTUAL_VENDOR 0xffff$'  .upstream-gold/fn_remap.c
          grep -q '^#define VIRTUAL_PRODUCT 0xffff$' .upstream-gold/fn_remap.c
          # 按文件名顺序预演一次：补丁之间有先后依赖（0002 基于 0001 之后的文件），
          # 逐个 --check 不足以发现顺序问题。build-module.sh 随后在自己的副本里重做。
          work=$(mktemp -d)
          cp -a .upstream-gold/. "$work/"
          for patch in ksu-module/gold-keyboard/patches/*.patch; do
            git -C "$work" apply --check "$GITHUB_WORKSPACE/$patch"
            git -C "$work" apply "$GITHUB_WORKSPACE/$patch"
          done
          rm -rf "$work"

      - name: Build module
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          GOLD_SRC: ${{ github.workspace }}/.upstream-gold
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-${{ env.ANDROID_PLATFORM }}/android.jar
          UPSTREAM_REPO: ${{ env.GOLD_REPO }}
          UPSTREAM_TAG: ${{ env.GOLD_TAG }}
          UPSTREAM_SHA: ${{ env.GOLD_SHA }}
        run: |
          set -euo pipefail
          chmod +x ksu-module/gold-keyboard/build-module.sh
          # build-module.sh 会用 GOLD_SRC 打补丁、编译、打包到 dist/。
          "$ANDROID_HOME"/build-tools/"$ANDROID_BUILD_TOOLS"/d8 --version || true
          ./ksu-module/gold-keyboard/build-module.sh \
            --ndk "$ANDROID_NDK_ROOT" \
            --out "$GITHUB_WORKSPACE/dist"

      - name: Verify module contents
        run: |
          set -euo pipefail
          archive=$(ls dist/Gold_Keyboardremaps-*-yingtian.zip)
          # 失败时先打印现场（zip 清单 + file/readelf 识别结果）再退出，避免静默 exit 1。
          on_err() {
            echo "---- 校验失败，dump 现场 ----"
            if [ -n "${archive:-}" ]; then
              unzip -l "$archive" || true
            fi
            if [ -f /tmp/mod/bin/fn-remap ]; then
              file /tmp/mod/bin/fn-remap || true
              readelf -h /tmp/mod/bin/fn-remap || true
              readelf -l /tmp/mod/bin/fn-remap || true
            fi
          }
          trap on_err ERR
          echo "check: zip 完整性（unzip -t）"
          unzip -t "$archive" >/dev/null
          # 模块必须带上 module.prop、守护进程二进制和我们的 config.conf。
          echo "check: 清单含 module.prop"
          unzip -l "$archive" | grep -q 'module.prop'
          echo "check: 清单含 bin/fn-remap"
          unzip -l "$archive" | grep -q 'bin/fn-remap'
          echo "check: 清单含 config.conf"
          unzip -l "$archive" | grep -q 'config.conf'
          # 二进制必须是 Android aarch64（bionic，不是 glibc）。
          # NDK clang 的 file 输出不含 "Android" 关键字（首跑即因此静默误判），
          # 改用 readelf 直接校验 ELF 机器类型和 PT_INTERP 解释器。
          mkdir -p /tmp/mod
          unzip -o -q "$archive" bin/fn-remap -d /tmp/mod
          echo "check: fn-remap 机器类型 AArch64"
          readelf -h /tmp/mod/bin/fn-remap | grep -q 'Machine:.*AArch64'
          echo "check: fn-remap 解释器 /system/bin/linker64（bionic）"
          readelf -l /tmp/mod/bin/fn-remap | grep -q 'Requesting program interpreter: /system/bin/linker64'

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-keyboard-ksu-yingtian
          path: |
            dist/Gold_Keyboardremaps-*-yingtian.zip
            dist/Gold_Keyboardremaps-*-yingtian.zip.sha256
          if-no-files-found: error

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=$(ls dist/Gold_Keyboardremaps-*-yingtian.zip)
          version=$(basename "$archive" | sed 's/^Gold_Keyboardremaps-//; s/-yingtian\.zip$//')
          tag="gold-keyboard-ksu-v${version}-yingtian"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" "$archive.sha256" --clobber
          else
            prerelease_flag=()
            [ "${{ inputs.prerelease }}" = "true" ] && prerelease_flag=(--prerelease)
            gh release create "$tag" "$archive" "$archive.sha256" \
              --title "Gold Keyboard Remaps ${version} (yingtian)" \
              --notes "由 \`build-gold-keyboard-ksu.yml\` 从上游 ${GOLD_TAG} 构建，应用 \`patches/\` 下的补丁（虚拟键盘伪装 Xiaomi 15d9:00a3；Android 系统键另走独立输出节点，沉浸模式下 Fn 层仍可触发 MIUI 原生截图/音量/亮度快捷键）。" \
              "${prerelease_flag[@]}"
          fi
